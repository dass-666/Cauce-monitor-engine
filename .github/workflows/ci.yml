      - name: v2.2 · Consentimiento por expediente (pytest)
        run: |
          python -m pytest -q -vv -rs -s tests/test_consentimiento_v22.py
          exit $LASTEXITCODE
      - name: v2.2 · Demostración completa con consentimiento exigido
        run: |
          python scripts/demo_v22.py --salida resultados/demo_v22
          exit $LASTEXITCODE
      - name: v2.3 · Recorrido de Ventanilla de principio a fin SOLO con la interfaz
        run: |
          python -m pytest -q -rs tests/test_recorrido_v23.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/recorrido_ventanilla_v23.py --salida resultados/recorrido_v23
          exit $LASTEXITCODE
      - name: v2.3 · Recorrido integral (respaldo, restauración, continuidad, cierre y retención con fecha simulada)
        run: |
          python scripts/recorrido_integral.py --salida resultados/recorrido_integral
          exit $LASTEXITCODE
      - name: Piloto · Simulacro de protección con medio externo en OTRA unidad (copia del diario, respaldo verificado, ensayo y restauración desde el medio)
        run: |
          $ws = (Get-Location).Drive.Name
          Write-Host "Repositorio en la unidad $($ws):"
          if ($ws -ne "C") {
            python scripts/recorrido_integral.py --externa "C:\cauce-simulacro-ci" --salida resultados/simulacro_proteccion
          } else {
            Write-Host "::warning::el repositorio está en C: — el simulacro usa la misma unidad (--laboratorio-misma-unidad)"
            python scripts/recorrido_integral.py --externa "$env:RUNNER_TEMP\simulacro" --laboratorio-misma-unidad --salida resultados/simulacro_proteccion
          }
          exit $LASTEXITCODE
