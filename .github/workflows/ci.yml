  # v2.2.1: contratos de interoperabilidad con Jarvis (lado Cauce). Ejecuta las pruebas de los
  # contratos y la demostración completa (inventario, manifiesto, suite pequeña, informe, validación,
  # consulta SIMULADA de Jarvis, repetición e idempotencia). Windows aquí es Windows Server de
  # GitHub Actions, NO el equipo físico de la oficina.
  jarvis-interop:
    name: Jarvis v2.2.1 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Iniciar PostgreSQL 16 (solo Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres-ci -e POSTGRES_DB=monitoreo_test -p 5432:5432 postgres:16
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
          echo "MONITOREO_TEST_PG=postgresql+psycopg://postgres:postgres-ci@localhost:5432/monitoreo_test" >> "$GITHUB_ENV"
          echo "DEMO_PG=--con-postgres" >> "$GITHUB_ENV"
      - name: Instalar dependencias (+ jsonschema y PyYAML solo para comparar validadores)
        run: |
          python -m pip install --only-binary=:all: -r requirements-postgres.txt jsonschema pyyaml
      - name: Pruebas de los contratos
        run: |
          mkdir -p resultados
          python -m pytest -q -rs tests/test_interop_jarvis.py --junitxml=resultados/junit_interop.xml
      - name: Demostración (dos rondas, idempotencia, comando no permitido)
        run: |
          python scripts/demo_jarvis_v221.py --suite humo $DEMO_PG --salida resultados/jarvis/demo_jarvis_v221.json
      - name: El repositorio quedó intacto
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Adjuntar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-interop-${{ matrix.os }}
          path: resultados/
          if-no-files-found: ignore
          retention-days: 14

  # v2.2.2 · REGRESIÓN de los dos defectos corregidos (BLOQUEA: si falla una sola repetición, el trabajo
  # falla). Sustituye a los trabajos de investigación investigar-despertar / investigar-observador, cuyos
  # resultados están en docs/INFORME_v2.2.2.md. Linux y Windows · Python 3.11 y 3.13.
  #   1. tests/test_supervisor_v222.py (sin navegador) 5 veces.
  #   2. test_changes_wake_the_cycle 30 veces normal y 30 veces con la CPU saturada (2 procesos por
  #      núcleo al 100 %), con el umbral original de 0,4 s; y 3 veces tras los archivos que la preceden.
  #   3. Solo Windows: test_limite_de_reinicios_detiene_con_motivo con navegador real, 8 veces (la
  #      prueba que fallaba 0-50 % en Windows).
  regresion-v222:
    name: Regresión v2.2.2 · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --only-binary=:all: -r requirements-postgres.txt
          mkdir -p resultados
      - name: "Supervisor: tests/test_supervisor_v222.py, 5 veces"
        run: |
          fallos=0
          for i in 1 2 3 4 5; do
            python -m pytest -q tests/test_supervisor_v222.py > resultados/supervisor_$i.txt 2>&1 || { fallos=$((fallos+1)); grep -E "^E +|FAILED" resultados/supervisor_$i.txt | head -5; }
            tail -1 resultados/supervisor_$i.txt
          done
          echo "SUPERVISOR: $fallos fallos de 5"
          test $fallos -eq 0
      - name: "Despertar: prueba real 30 veces (normal)"
        run: |
          fallos=0
          for i in $(seq 1 30); do
            python -m pytest -q tests/test_ciclo_despertar.py > resultados/despertar_$i.txt 2>&1 || { fallos=$((fallos+1)); grep -E "^E +" resultados/despertar_$i.txt | head -2; }
          done
          echo "DESPERTAR NORMAL: $fallos fallos de 30"
          test $fallos -eq 0
      - name: "Despertar: prueba real 30 veces con la CPU saturada"
        run: |
          n=$(python -c "import os; print(2 * (os.cpu_count() or 2))")
          pids=""
          for j in $(seq 1 $n); do python -c "while True: pass" & pids="$pids $!"; done
          echo "procesos de carga: $n"
          fallos=0
          for i in $(seq 1 30); do
            python -m pytest -q tests/test_ciclo_despertar.py > resultados/despertar_carga_$i.txt 2>&1 || { fallos=$((fallos+1)); grep -E "^E +" resultados/despertar_carga_$i.txt | head -2; }
          done
          kill $pids 2>/dev/null || true
          echo "DESPERTAR CON CARGA: $fallos fallos de 30"
          test $fallos -eq 0
      - name: "Despertar: tras los archivos que la preceden en la suite, 3 veces"
        run: |
          previos=$(ls tests/test_*.py | awk '$0 < "tests/test_ciclo_despertar.py"')
          fallos=0
          for i in 1 2 3; do
            python -m pytest -q $previos tests/test_ciclo_despertar.py > resultados/contexto_$i.txt 2>&1 || { fallos=$((fallos+1)); grep -E "^E +|FAILED" resultados/contexto_$i.txt | head -3; }
            tail -1 resultados/contexto_$i.txt
          done
          echo "EN CONTEXTO: $fallos fallos de 3"
          test $fallos -eq 0
      - name: "Medición por partes (informativa, no decide)"
        if: always()
        run: |
          python scripts/investigar_despertar.py --repeticiones 40 --salida resultados/investigar_despertar.json 2>/dev/null | grep -E '^(normal|carga|aislado|carga_aislado) ' || true
      - name: Navegador para el observador (solo Windows)
        if: runner.os == 'Windows'
        run: |
          npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install chromium
      - name: "Observador real: test_limite_de_reinicios_detiene_con_motivo, 8 veces (solo Windows)"
        if: runner.os == 'Windows'
        run: |
          fallos=0
          for i in $(seq 1 8); do
            python -m pytest -q tests/test_observador_persistente.py -k test_limite_de_reinicios > resultados/obs_$i.txt 2>&1 || { fallos=$((fallos+1)); grep -E "^E +" resultados/obs_$i.txt | head -2; }
            tail -1 resultados/obs_$i.txt
          done
          echo "OBSERVADOR: $fallos fallos de 8"
          test $fallos -eq 0
      - name: "Suite planificador por el ejecutor de Jarvis (incluye test_supervisor_v222.py)"
        run: |
          python -m monitoreo.interop ejecutar --suite planificador | tail -1
      - name: Adjuntar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regresion-v222-${{ matrix.os }}-py${{ matrix.python }}
          path: resultados/
          if-no-files-found: ignore
          retention-days: 14

  # v2.2.2 · INVESTIGACIÓN (no bloquea): la comprobación «cambios duraderos del proveedor no detectados
  # FUERA de ventanas de fallo» falló 1 vez (14/15) en Integración HTTP · Windows (CI 44452147825,
  # OES-035 versión 92). Repite el escenario corto 6 veces en Windows y escribe en el registro el
  # diagnóstico de cada cambio no detectado (consultas alrededor, eventos del recurso, cambios vecinos).
  # No sustituye al trabajo integracion-http-windows, que sigue bloqueando.
  investigar-http-windows:
    name: Investigación integración HTTP · Windows · repetición ${{ matrix.tanda }}
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        tanda: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --only-binary=:all: -r requirements-postgres.txt
      - name: "Escenario corto 3 veces, con diagnóstico"
        run: |
          fallos=0
          for i in 1 2 3; do
            python scripts/integracion_http.py --rapido --salida resultados/http_$i > resultados_http_$i.txt 2>&1 || fallos=$((fallos+1))
            grep -E "FALLO|resultado en" resultados_http_$i.txt
          done
          echo "HTTP WINDOWS - $fallos fallos de 3"
