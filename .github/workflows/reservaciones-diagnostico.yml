name: Diagnóstico de Reservaciones (Windows)
# Solo diagnóstico: repite el recorrido v2.3 en Windows para medir con qué frecuencia falla y con qué evidencia.
# No forma parte del CI normal; se ejecuta al empujar a esta rama de investigación.
on:
  push:
    branches: [claude/ci-reservaciones-diagnostico]
permissions:
  contents: read
jobs:
  repetir:
    name: v2.3 · repetición ${{ matrix.rep }} · Windows · Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: "python -m pip install --only-binary=:all: -r requirements-postgres.txt"
      - name: Preparar navegador
        run: |
          python scripts/preparar_navegador.py
          exit $LASTEXITCODE
      - name: Estado de sockets antes
        run: netstat -an | Select-String "TCP" | ForEach-Object { ($_ -split "\s+")[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }
      - name: Recorrido v2.3 (3 vueltas seguidas en el mismo equipo)
        run: |
          $fallos = 0
          foreach ($i in 1..3) {
            python scripts/recorrido_ventanilla_v23.py --salida "resultados/v23_$i" 2>&1 | Select-String -Pattern "RESULTADO|FALLA|DIAGNOSTICO"
            if ($LASTEXITCODE -ne 0) { $fallos++ }
          }
          "VUELTAS_FALLIDAS=$fallos de 3"
          exit 0
      - name: Estado de sockets después
        run: netstat -an | Select-String "TCP" | ForEach-Object { ($_ -split "\s+")[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }
