name: Diagnóstico de Reservaciones (Windows)
permissions:
  contents: read
jobs:
  repetir:
    name: v2.3 · repetición ${{ matrix.rep }} · Windows · Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rep:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Instalar dependencias
      run: 'python -m pip install --only-binary=:all: -r requirements-postgres.txt'
    - name: Preparar navegador
      run: 'python scripts/preparar_navegador.py

        exit $LASTEXITCODE

        '
    - name: Estado de sockets antes
      run: netstat -an | Select-String "TCP" | ForEach-Object { ($_ -split "\s+")[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }
    - name: Recorrido v2.3 (3 vueltas seguidas en el mismo equipo)
      run: "$fallos = 0\nforeach ($i in 1..3) {\n  python scripts/recorrido_ventanilla_v23.py --salida \"resultados/v23_$i\" 2>&1 | Select-String -Pattern \"RESULTADO|FALLA|DIAGNOSTICO\"\n  if ($LASTEXITCODE\
        \ -ne 0) { $fallos++ }\n}\n\"VUELTAS_FALLIDAS=$fallos de 3\"\nexit 0\n"
    - name: Estado de sockets después
      run: netstat -an | Select-String "TCP" | ForEach-Object { ($_ -split "\s+")[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }
  secuencia:
    name: Secuencia completa del job · repetición ${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        rep:
        - 1
        - 2
        - 3
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Instalar dependencias (solo paquetes precompilados)
      run: 'python -m pip install --only-binary=:all: -r requirements-postgres.txt'
    - name: Preparar navegador (cierre v2.1 · dentro de la instalación, en .browsers)
      run: 'python scripts/preparar_navegador.py

        exit $LASTEXITCODE

        '
    - name: 'SOCKETS tras: Preparar navegador (cierre v2.1 · dentro de la instalación, en .browsers)'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: Diagnóstico del navegador (el motor lo encuentra solo)
      run: 'if ($env:PLAYWRIGHT_BROWSERS_PATH) { throw "PLAYWRIGHT_BROWSERS_PATH no debería estar definida" }

        python -m monitoreo.navegador --probar

        exit $LASTEXITCODE

        '
    - name: 'SOCKETS tras: Diagnóstico del navegador (el motor lo encuentra solo)'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: Recorrido completo expediente → folio, con reinicio brusco
      run: 'python scripts/demo_reservacion.py --salida resultados/demo --capturas resultados/capturas

        exit $LASTEXITCODE

        '
      continue-on-error: true
    - name: 'SOCKETS tras: Recorrido completo expediente → folio, con reinicio brusco'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: v1.6 · Recorrido POR DÍA con reinicio y calendario sin comunicación
      run: 'python scripts/demo_dia.py --salida resultados/demo_dia --capturas resultados/capturas_dia

        exit $LASTEXITCODE

        '
      continue-on-error: true
    - name: 'SOCKETS tras: v1.6 · Recorrido POR DÍA con reinicio y calendario sin comunicación'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: v1.6 · Laboratorio multisucursal (reducido)
      run: 'python scripts/laboratorio_dias.py --mecanismo ambos --expedientes 150 --operadores 6 --noche-s 90 --salida resultados/laboratorio_dias

        exit $LASTEXITCODE

        '
      continue-on-error: true
    - name: 'SOCKETS tras: v1.6 · Laboratorio multisucursal (reducido)'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: v1.7 · Panel en navegador real (centro, supervisión, notificaciones, Mi trabajo, reinicio, sin conexión)
      run: 'python scripts/demo_v17.py --salida resultados/demo_v17 --capturas resultados/capturas_v17

        exit $LASTEXITCODE

        '
      continue-on-error: true
    - name: 'SOCKETS tras: v1.7 · Panel en navegador real (centro, supervisión, notificaciones, Mi trabajo, reinicio, sin conexión)'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: v2.0 · Ventanilla en navegador real (6 citas, sin cita, duplicado, retomar tras reinicio, móvil)
      run: 'python scripts/demo_v20.py --salida resultados/demo_v20 --capturas resultados/capturas_v20

        exit $LASTEXITCODE

        '
      continue-on-error: true
    - name: 'SOCKETS tras: v2.0 · Ventanilla en navegador real (6 citas, sin cita, duplicado, retomar tras reinicio, móvil)'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: v2.1 · Observador de calendario con navegador real (pytest)
      run: 'python -m pytest -q -vv -rs -s tests/test_observador.py tests/test_observador_persistente.py tests/test_planificador.py tests/test_plan_unidades_propiedad.py tests/test_cierre_v21.py

        exit $LASTEXITCODE

        '
      continue-on-error: true
    - name: 'SOCKETS tras: v2.1 · Observador de calendario con navegador real (pytest)'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: v2.1 · Recorrido integrado plan → calendario abierto → evento → coincidencia → folio
      run: 'python scripts/recorrido_v21.py --salida resultados/recorrido_v21

        exit $LASTEXITCODE

        '
      continue-on-error: true
    - name: 'SOCKETS tras: v2.1 · Recorrido integrado plan → calendario abierto → evento → coincidencia → folio'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: v2.1 · Aceptación (Ventanilla «Plan del día», varias unidades, propiedad única, reinicios)
      run: 'python scripts/aceptacion_v21.py --salida resultados/aceptacion_v21

        exit $LASTEXITCODE

        '
      continue-on-error: true
    - name: 'SOCKETS tras: v2.1 · Aceptación (Ventanilla «Plan del día», varias unidades, propiedad única, reinicios)'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: v2.2 · Consentimiento por expediente (pytest)
      run: 'python -m pytest -q -vv -rs -s tests/test_consentimiento_v22.py

        exit $LASTEXITCODE

        '
      continue-on-error: true
    - name: 'SOCKETS tras: v2.2 · Consentimiento por expediente (pytest)'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: v2.2 · Demostración completa con consentimiento exigido
      run: 'python scripts/demo_v22.py --salida resultados/demo_v22

        exit $LASTEXITCODE

        '
      continue-on-error: true
    - name: 'SOCKETS tras: v2.2 · Demostración completa con consentimiento exigido'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
    - name: v2.3 · Recorrido de Ventanilla de principio a fin SOLO con la interfaz
      run: 'python -m pytest -q -rs tests/test_recorrido_v23.py

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        python scripts/recorrido_ventanilla_v23.py --salida resultados/recorrido_v23

        exit $LASTEXITCODE

        '
      continue-on-error: true
    - name: 'SOCKETS tras: v2.3 · Recorrido de Ventanilla de principio a fin SOLO con la interfaz'
      if: always()
      run: '$e = netstat -an | Select-String ''TCP'' | ForEach-Object { ($_ -split ''\s+'')[-1] } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }

        "SOCKETS $($e -join '' '')"

        '
'on':
  push:
    branches:
    - claude/ci-reservaciones-diagnostico
