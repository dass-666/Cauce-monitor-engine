# Prueba de aislamiento de Forms en Windows con el lanzador de Monitor (cuenta restringida + ACL NTFS + Firewall).
# Corre SOLO en runners efímeros de GitHub: crea y borra una cuenta local de un solo uso, con datos FICTICIOS.
# Su veredicto dice si la técnica funciona en ese runner; NO demuestra nada sobre la MSI ni sobre una instalación real.
# No activa aislamiento.puede_lanzar() (sigue en False).
name: Aislamiento Forms Windows

on:
  push:
    branches: ["claude/project-thread-4lnq8h", "claude/project-thread-vaxyhp"]
  pull_request:
    paths:
      - "monitoreo/autorrelleno/lanzador_restringido.py"
      - "monitoreo/autorrelleno/aislamiento_lab.py"
      - "monitoreo/autorrelleno/adaptador.py"
      - "monitoreo/autorrelleno/coincidencia.py"
      - "tests/test_aislamiento_ventanilla.py"
      - "scripts/aislamiento_*"
      - ".github/workflows/aislamiento.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lanzador-restringido:
    name: Aislamiento con el lanzador · ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dass-666/CAUCE-UNIVERSAL-CONEXION
          ref: aa1bb0295b32c17ba0435490678adf1ee54c55a0
          path: conector-universal
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install psutil
      - name: Forms real en su propio entorno virtual (para A11)
        shell: pwsh
        run: |
          python -m venv conector-universal\.venv
          conector-universal\.venv\Scripts\python -m pip install -q -r conector-universal\requirements-dev.txt
      - name: Prueba de aislamiento (A1-A11) como cuenta restringida
        shell: pwsh
        env:
          CAUCE_AISLAMIENTO_EFIMERO: "1"
        run: python scripts/aislamiento_windows_lanzador.py --salida aislamiento_lanzador.json --forms-dir conector-universal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aislamiento-lanzador-py${{ matrix.python }}
          path: aislamiento_lanzador.json
          if-no-files-found: warn

  # Ventanilla -> Forms como la cuenta restringida, con el adaptador de Monitor (comprobación activa antes de cada
  # lanzamiento), ACL NTFS reales sobre carpetas temporales y datos FICTICIOS. Misma prueba que en Linux
  # (tests/test_aislamiento_ventanilla.py), aquí con CreateProcessWithLogonW + Job Object + DPAPI.
  ventanilla-aislada:
    name: Ventanilla aislada (Windows) · ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -q -r requirements.txt
      # Forms REAL (mismo commit que en las pruebas Linux) en su propio entorno y con su propio Chromium, para que la
      # cuenta del conector lo ejecute a través de Ventanilla (test_forms_real_aislado_*).
      - uses: actions/checkout@v4
        with:
          repository: dass-666/CAUCE-UNIVERSAL-CONEXION
          ref: ff117da71140e263d1a2cf29436ff63b21ad13ce
          path: forms-lab
          persist-credentials: false
      - name: Forms real en su entorno (para Ventanilla aislada)
        shell: pwsh
        run: |
          python -m venv forms-lab\.venv
          forms-lab\.venv\Scripts\python -m pip install -q -r forms-lab\requirements.txt
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\forms-lab\.pw-browsers"
          forms-lab\.venv\Scripts\python -m playwright install chromium
          "FORMS_REPO=$PWD\forms-lab" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Cuenta local de un solo uso (no administradora, clave aleatoria)
        shell: pwsh
        run: |
          $clave = "Aa1!" + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          Write-Output "::add-mask::$clave"
          net user cauce_conector_t $clave /add /expires:never /y | Out-Null
          "CAUCE_AISLAMIENTO_CUENTA=cauce_conector_t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CAUCE_AISLAMIENTO_CLAVE=$clave" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (net user cauce_conector_t | Select-String "Local Group|Grupos locales").Line
      - name: Regla de Firewall de salida para la cuenta (todo salvo loopback)
        shell: pwsh
        run: |
          $sid = (New-Object System.Security.Principal.NTAccount('cauce_conector_t')).Translate([System.Security.Principal.SecurityIdentifier]).Value
          Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultOutboundAction | Format-Table | Out-String | Write-Output
          New-NetFirewallRule -DisplayName 'cauce-conector-sin-red' -Direction Outbound -Action Block `
            -LocalUser "D:(A;;CC;;;$sid)" `
            -RemoteAddress '0.0.0.0-126.255.255.255','128.0.0.0-255.255.255.255','::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff' | Out-Null
          "CAUCE_AISLAMIENTO_REGLA_RED=cauce-conector-sin-red" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Pruebas de Ventanilla aislada y del lanzador restringido
        shell: pwsh
        env:
          CAUCE_AISLAMIENTO_EFIMERO: "1"
        run: python -m pytest -v -rs tests/test_aislamiento_ventanilla.py tests/test_lanzador_restringido.py --junitxml=ventanilla_aislada.xml
      - name: Borrar la cuenta
        if: always()
        shell: pwsh
        run: |
          Remove-NetFirewallRule -DisplayName 'cauce-conector-sin-red' -ErrorAction SilentlyContinue
          net user cauce_conector_t /delete
          Get-CimInstance Win32_UserProfile | Where-Object { $_.LocalPath -like "*cauce_conector_t*" } | Remove-CimInstance -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ventanilla-aislada-py${{ matrix.python }}
          path: ventanilla_aislada.xml
          if-no-files-found: warn
